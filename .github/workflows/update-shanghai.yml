name: Record Shanghai premium

on:
  schedule:
    - cron: "25 6 * * 1-5"    # just after the SGE PM benchmark (06:15 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_shanghai.py"
      - ".github/workflows/update-shanghai.yml"

permissions:
  contents: write

concurrency:
  group: update-shanghai
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch SGE benchmark, LBMA price and exchange rate
        run: python scripts/update_shanghai.py
        env:
          METALCHARTS_API_KEY: ${{ secrets.METALCHARTS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "macro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shanghai-premium.json data/shanghai-status.json 2>/dev/null || git add data/shanghai-status.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Record Shanghai premium"
            git pull --rebase origin main
            git push
          fi
