name: Midterm dollar study (one-off)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/midterm_study.py"
      - ".github/workflows/midterm-study.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/midterm_study.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "macro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/midterm-study.json
          git diff --cached --quiet || (git commit -m "Midterm dollar study data" && git pull --rebase origin main && git push)
