name: IndexNow ping

# Tells Bing, Yandex, Naver, Seznam and other IndexNow search engines about
# new or changed pages right after they go live, instead of waiting for a crawl.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for GitHub Pages to publish
        run: sleep 150
      - name: Collect URLs and notify IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ inputs.all }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          host = "decisionframework.online"
          base = f"https://{host}"
          key = open(next(f for f in os.listdir(".") if re.fullmatch(r"[0-9a-f]{32}\.txt", f))).read().strip()
          skip = ("license/", "license-order/", "welcome.html", "indicators-teaser-snippet.html", "ratio-widget-test.html")
          def to_url(p):
              if p == "index.html": return base + "/"
              if p.endswith("/index.html"): return f"{base}/{p[:-10]}"
              return f"{base}/{p}"
          before, after = os.environ.get("BEFORE", ""), os.environ["AFTER"]
          if os.environ.get("ALL") == "true" or not before or set(before) == {"0"}:
              urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())
          else:
              files = subprocess.run(["git", "diff", "--name-only", "--diff-filter=AM", before, after],
                                     capture_output=True, text=True, check=True).stdout.split()
              urls = [to_url(f) for f in files if f.endswith(".html") and not f.startswith(skip)]
          urls = sorted(set(urls))[:10000]
          print(f"{len(urls)} URL(s)")
          if not urls:
              raise SystemExit(0)
          body = json.dumps({"host": host, "key": key, "keyLocation": f"{base}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("IndexNow answered", r.status)
          PY
