name: Update dollar and rates data

on:
  schedule:
    - cron: "40 21 * * *"   # every day 21:40 UTC (23:40 Brussels summer time)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_macro.py"
      - ".github/workflows/update-macro.yml"

permissions:
  contents: write

concurrency:
  group: update-macro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch dollar, Treasury curve and stress series from FRED
        run: python scripts/update_macro.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "macro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json data/macro-status.json 2>/dev/null || git add data/macro-status.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update dollar and rates data"
            git pull --rebase origin main
            git push
          fi
