name: Update crack spreads

on:
  schedule:
    - cron: "30 21 * * *"   # every day 21:30 UTC (23:30 Brussels summer time)
  workflow_dispatch:         # run by hand: Actions tab > Update crack spreads > Run workflow
  push:
    branches: [main]
    paths:
      - "scripts/update_cracks.py"
      - ".github/workflows/update-cracks.yml"

permissions:
  contents: write

concurrency:
  group: update-cracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch EIA prices from FRED and compute cracks
        run: python scripts/update_cracks.py
      - name: Commit if changed
        run: |
          git config user.name "crack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cracks.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update crack spreads data"
            git pull --rebase origin main
            git push
          fi
